name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        shell: bash
        env:
          PYTHON: python
        run: bash tools/build_exe.sh

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          ls -lh dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/商人听金.exe#商人听金.exe" --clobber
          else
            gh release create "$TAG" "dist/商人听金.exe#商人听金.exe" --title "$TAG" --generate-notes
          fi
